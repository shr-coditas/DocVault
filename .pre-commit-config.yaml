repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # run ruff from the project venv so hook and CI versions can't drift
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv --directory backend run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv --directory backend run ruff format
        language: system
        types: [python]
        pass_filenames: false
