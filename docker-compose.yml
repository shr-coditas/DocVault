services:
  api:
    build:
      context: ./backend
      target: api
    command: sh -c "alembic upgrade head && python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8080:8000"
      - "127.0.0.1:5678:5678"
    volumes:
      - ./backend:/app
      - /app/.venv          # keep the image's venv; the bind mount above would otherwise hide it
    environment:
      DATABASE_URL: postgresql+asyncpg://docvault:docvault@db:5432/docvault
      S3_ENDPOINT_URL: http://minio:9000
      LOG_JSON: "true"
      CHUNK_MAX_TOKENS: "400"
      EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
      EMBEDDING_BATCH_SIZE: "32"
      EMBEDDING_THREADS: "1"
      EMBEDDING_QUERY_PREFIX: "Represent this sentence for searching relevant passages: "
      ANSWER_MAX_SOURCES: "8"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  indexer:
    profiles: ["indexer"]
    build:
      context: ./backend
      target: worker
    command: python -m app.scripts.index_documents
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      DATABASE_URL: postgresql+asyncpg://docvault:docvault@db:5432/docvault
      S3_ENDPOINT_URL: http://minio:9000
      LOG_JSON: "true"
      FASTEMBED_CACHE_DIR: /opt/models
      CHUNK_MAX_TOKENS: "400"
      EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
      EMBEDDING_BATCH_SIZE: "32"
      EMBEDDING_THREADS: "1"
      EMBEDDING_QUERY_PREFIX: "Represent this sentence for searching relevant passages: "
      ANSWER_MAX_SOURCES: "8"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  streamlit:
    build: ./streamlit_ui
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit_ui:/app
      - /app/.venv          # keep the image's venv; the bind mount above would otherwise hide it
    environment:
      API_URL: http://api:8000/api/v1
      HOME: /home/app
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      COOKIE_SECURE: "false"   # the demo is served over plain http; set true behind TLS
    depends_on:
      api:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docvault
      MINIO_ROOT_PASSWORD: docvault123
    ports:
      - "9000:9000"
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 docvault docvault123
      && mc mb --ignore-existing local/docvault"

  db:
    # pgvector's own image, not plain postgres:17 - the extension ships as a shared
    # library, so it must be present in the image. Switching this requires recreating
    # the db_data volume (docker compose down -v), which destroys local data.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: docvault
      POSTGRES_PASSWORD: docvault
      POSTGRES_DB: docvault
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docvault -d docvault"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  minio_data:
